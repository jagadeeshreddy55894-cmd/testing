<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Hostel Attendance</title>

    <link rel="stylesheet" href="stylish.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <!-- Top Bar -->

    <header class="topbar">

        <div class="left">

            <span class="material-icons back">
                arrow_back
            </span>

        </div>

        <div class="center">
            Hostel Attendance
        </div>

        <div class="right">
            History
        </div>

    </header>

    <!-- Main -->

    <main class="page">

        <section class="card">

            <div class="image-box">

                <!-- Replace this image -->
                <img src="student.jpg" alt="Student">

            </div>

            <h2 class="student-name">
                JAGADEESH REDDY
            </h2>

            <div class="info">

                <div class="row">

                    <div class="label">
                        Registration Number
                    </div>

                    <div class="value">
                        12319086
                    </div>

                </div>

                <div class="row">

                    <div class="label">
                        Block
                    </div>

                    <div class="value">
                        BH-4
                    </div>

                </div>

                <div class="row">

                    <div class="label">
                        Room Number
                    </div>

                    <div class="value">
                        321
                    </div>

                </div>

                <div class="row">

                    <div class="label">
                        Date
                    </div>

                    <div class="value">
                        24 Jul 2026
                    </div>

                </div>

                <div class="row">

                    <div class="label">
                        Time
                    </div>

                    <div class="value">
                        08:30 PM
                    </div>

                </div>

            </div>

            <div class="instruction">

                Kindly click on the<br>
                desired meal to<br>
                mark attendance

            </div>
            <!-- Meal Buttons -->

            <div class="meal-container">

                <button class="meal-btn">

                    <span>Breakfast</span>

                    <span class="material-icons">
                        keyboard_arrow_right
                    </span>

                </button>

                <button class="meal-btn">

                    <span>Lunch</span>

                    <span class="material-icons">
                        keyboard_arrow_right
                    </span>

                </button>

                <button class="meal-btn dinner">

                    <span>Dinner</span>

                    <span class="material-icons">
                        keyboard_arrow_right
                    </span>

                </button>

            </div>

        </section>

    </main>

</body>

</html>
