<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Feedback</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #111111;
    font-family: Arial, sans-serif;
}


/* =========================
   TOP BAR
========================= */

.topbar {
    height: 118px;
    width: 100%;
    background: #333333;
    color: white;

    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;
}

.handle {
    position: absolute;
    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    width: 62px;
    height: 7px;

    background: #dddddd;
    border-radius: 10px;
}

.top-title {
    font-size: 28px;
    font-weight: 400;
    margin-top: 18px;
}

.close-btn {
    position: absolute;
    right: 22px;
    top: 50%;

    transform: translateY(-25%);

    border: none;
    background: transparent;

    color: white;
    font-size: 32px;
    font-weight: 300;

    cursor: pointer;
}


/* =========================
   MAIN
========================= */

.main {
    width: 100%;
    padding-bottom: 30px;
}


/* =========================
   TITLE
========================= */

.feedback-title {
    text-align: center;

    font-size: 30px;
    font-weight: 400;

    margin: 32px 0 12px;
}

.feedback-subtitle {
    text-align: center;

    font-size: 22px;
    font-weight: 400;

    margin: 0 0 34px;
}


/* =========================
   STARS
========================= */

.stars {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 12px;

    margin-bottom: 38px;
}

.star {
    font-size: 50px;
    line-height: 1;

    color: #f4c21c;

    cursor: pointer;

    user-select: none;
}


/* =========================
   MEAL TYPE
========================= */

.meal-title {
    font-size: 22px;
    font-weight: 400;

    margin: 0 0 18px;
    padding-left: 22px;
}

.meal-buttons {
    display: flex;

    gap: 10px;

    padding: 0 22px;
}

.meal-buttons button {
    flex: 1;

    height: 58px;

    background: white;

    border: 3px solid #999999;
    border-radius: 18px;

    font-size: 18px;
    font-weight: 600;

    color: #111111;
}

.meal-buttons button.selected {
    background: #eeeeee;
}


/* =========================
   COMPLAINT SECTIONS
========================= */

#complaintArea {
    display: none;
}

.section-title {
    text-align: center;

    font-size: 25px;
    font-weight: 700;

    text-decoration: underline;

    margin-top: 46px;
    margin-bottom: 24px;
}

.feedback-list {
    width: calc(100% - 44px);

    margin: 0 auto;

    background: #ffffff;
}

.feedback-item {
    min-height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 12px;

    border-bottom: 1px solid #dddddd;

    font-size: 20px;
    line-height: 1.25;
}

.feedback-item span {
    max-width: 82%;
}


/* =========================
   CHECKBOX
========================= */

.feedback-item input {
    appearance: none;
    -webkit-appearance: none;

    width: 31px;
    height: 31px;

    border: 3px solid #999999;
    border-radius: 5px;

    background: white;

    flex-shrink: 0;
}

.feedback-item input:checked {
    background: #ef8b25;

    border-color: #ef8b25;

    position: relative;
}

.feedback-item input:checked::after {
    content: "✓";

    position: absolute;

    color: white;

    font-size: 24px;
    font-weight: bold;

    left: 3px;
    top: -2px;
}


/* =========================
   REMARKS
========================= */

.remarks-title {
    text-align: center;

    font-size: 25px;
    font-weight: 700;

    text-decoration: underline;

    margin-top: 44px;
    margin-bottom: 10px;
}

textarea {
    display: block;

    width: 82%;
    height: 100px;

    margin: 0 auto;

    border: 2px solid #cccccc;
    border-radius: 3px;

    resize: none;

    padding: 10px;

    font-family: Arial, sans-serif;
    font-size: 18px;
}


/* =========================
   SUBMIT
========================= */

.submit-btn {
    display: block;

    width: 260px;
    height: 65px;

    margin: 34px auto 50px;

    border: none;
    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #ff8175,
        #ffd36b
    );

    color: #111111;

    font-size: 22px;
    font-weight: 400;

    box-shadow:
        0 8px 12px rgba(0,0,0,0.20);

    cursor: pointer;
}


/* =========================
   5 STAR AREA
========================= */

#fiveStarArea {
    display: none;

    text-align: center;

    padding: 40px 20px;
}

#fiveStarArea h2 {
    font-size: 27px;
    margin-bottom: 15px;
}

#fiveStarArea p {
    font-size: 20px;
}


/* =========================
   POPUP
========================= */

.popup-overlay {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 99999;

    background: rgba(0,0,0,0.45);

    align-items: center;
    justify-content: center;
}

.popup-box {
    width: 82%;
    max-width: 340px;

    background: white;

    border-radius: 22px;

    overflow: hidden;

    text-align: center;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.35);
}

.popup-box h2 {
    font-size: 25px;

    margin: 28px 15px 12px;
}

.popup-box p {
    font-size: 17px;

    line-height: 1.45;

    padding: 0 20px 22px;

    margin: 0;
}

.popup-ok {
    width: 100%;

    height: 62px;

    border: none;

    border-top: 1px solid #dddddd;

    background: white;

    color: #e88a28;

    font-size: 23px;

    font-weight: 700;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .topbar {
        height: 118px;
    }

    .top-title {
        font-size: 28px;
    }

    .feedback-title {
        font-size: 30px;
    }

    .feedback-subtitle {
        font-size: 22px;
    }

    .star {
        font-size: 50px;
    }

    .meal-title {
        font-size: 22px;
    }

    .meal-buttons button {
        font-size: 18px;
        padding: 0 3px;
    }

    .section-title {
        font-size: 25px;
    }

    .feedback-item {
        font-size: 20px;
    }

}

</style>
</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

    <div class="handle"></div>

    <div class="top-title">
        Feedback
    </div>

    <button
        class="close-btn"
        onclick="goBack()">
        ✕
    </button>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="main">


    <h1 class="feedback-title">
        Mess Feedback
    </h1>

    <div class="feedback-subtitle">
        Tell us how we did!
    </div>


    <!-- STARS -->

    <div class="stars">

        <span class="star" onclick="selectStar(1)">☆</span>

        <span class="star" onclick="selectStar(2)">☆</span>

        <span class="star" onclick="selectStar(3)">☆</span>

        <span class="star" onclick="selectStar(4)">☆</span>

        <span class="star" onclick="selectStar(5)">☆</span>

    </div>


    <!-- MEAL TYPE -->

    <div class="meal-title">
        Tap to select meal type
    </div>


    <div class="meal-buttons">

        <button onclick="selectMeal(this)">
            Breakfast
        </button>

        <button onclick="selectMeal(this)">
            Lunch
        </button>

        <button onclick="selectMeal(this)">
            Tea
        </button>

        <button onclick="selectMeal(this)">
            Dinner
        </button>

    </div>


    <!-- =========================
         1-4 STAR CONTENT
    ========================= -->

    <div id="complaintArea">


        <!-- SERVICE / STAFF -->

        <div class="section-title">
            Service/Staff
        </div>

        <div class="feedback-list">

            <label class="feedback-item">
                <span>Food served late</span>

                <input type="checkbox">
            </label>

            <label class="feedback-item">
                <span>Staff not polite</span>

                <input type="checkbox">
            </label>

        </div>


        <!-- QUANTITY -->

        <div class="section-title">
            Quantity
        </div>

        <div class="feedback-list">

            <label class="feedback-item">
                <span>Refills not available</span>

                <input type="checkbox">
            </label>

            <label class="feedback-item">
                <span>Less food</span>

                <input type="checkbox">
            </label>

        </div>


        <!-- HYGIENE -->

        <div class="section-title">
            Hygiene
        </div>

        <div class="feedback-list">

            <label class="feedback-item">
                <span>Staff not hygienic</span>

                <input type="checkbox">
            </label>

            <label class="feedback-item">
                <span>Utensils dirty</span>

                <input type="checkbox">
            </label>

            <label class="feedback-item">
                <span>Mess not clean</span>

                <input type="checkbox">
            </label>

        </div>


        <!-- FOOD QUALITY -->

        <div class="section-title">
            Food Quality
        </div>

        <div class="feedback-list">

            <label class="feedback-item">
                <span>Tasteless</span>

                <input type="checkbox">
            </label>

            <label class="feedback-item">
                <span>Not fresh</span>

                <input type="checkbox">
            </label>

            <label class="feedback-item">
                <span>Undercooked / overcooked</span>

                <input type="checkbox">
            </label>

            <label class="feedback-item">
                <span>Too oily/greasy</span>

                <input type="checkbox">
            </label>

        </div>


        <!-- REMARKS -->

        <div class="remarks-title">
            Remarks (If Any)
        </div>

        <textarea
            id="remarks"
            placeholder="">
        </textarea>


        <!-- SUBMIT -->

        <button
            class="submit-btn"
            onclick="submitFeedback()">

            Submit

        </button>

    </div>


    <!-- =========================
         5 STAR CONTENT
    ========================= -->

    <div id="fiveStarArea">

        <h2>
            Thank you! ⭐
        </h2>

        <p>
            We're glad you enjoyed your meal.
        </p>

    </div>


</div>


<!-- =========================
     SUCCESS POPUP
========================= -->

<div
    id="successPopup"
    class="popup-overlay">

    <div class="popup-box">

        <h2>
            Message
        </h2>

        <p>
            Thank you for your feedback!<br>
            Your input helps improve the mess service.
        </p>

        <button
            class="popup-ok"
            onclick="goBack()">

            OK

        </button>

    </div>

</div>


<script>

/* =========================
   STAR SELECTION
========================= */

let selectedRating = 0;

function selectStar(rating) {

    selectedRating = rating;

    const stars =
        document.querySelectorAll(".star");

    stars.forEach(function(star, index) {

        if (index < rating) {

            star.textContent = "★";

        } else {

            star.textContent = "☆";

        }

    });


    /*
       1,2,3,4 stars
       = complaint form
    */

    if (rating >= 1 && rating <= 4) {

        document.getElementById(
            "complaintArea"
        ).style.display = "block";

        document.getElementById(
            "fiveStarArea"
        ).style.display = "none";

    }


    /*
       5 stars
       = separate satisfied content
    */

    if (rating === 5) {

        document.getElementById(
            "complaintArea"
        ).style.display = "none";

        document.getElementById(
            "fiveStarArea"
        ).style.display = "block";

    }

}


/* =========================
   MEAL SELECTION
========================= */

function selectMeal(button) {

    const buttons =
        document.querySelectorAll(
            ".meal-buttons button"
        );

    buttons.forEach(function(btn) {

        btn.classList.remove("selected");

    });

    button.classList.add("selected");

}


/* =========================
   SUBMIT
========================= */

function submitFeedback() {

    if (selectedRating === 0) {

        alert("Please select a rating first.");

        return;

    }

    document.getElementById(
        "successPopup"
    ).style.display = "flex";

}


/* =========================
   BACK TO MESS PASS
========================= */

function goBack() {

    window.location.href = "index.html";

}

</script>

</body>
</html>
